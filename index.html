<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MANVPN Speedtest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <!-- TOP -->
    <div class="topbar">
        <div class="close">✕</div>
        <div class="title">SPEEDTEST</div>
        <div class="menu">☰</div>
    </div>

    <!-- BOXES -->
    <div class="stats-top">

        <div class="box download-box">
            <div class="box-title">DOWNLOAD Mbps</div>
            <div class="box-num" id="downTop">--</div>
        </div>

        <div class="box upload-box">
            <div class="box-title">UPLOAD Mbps</div>
            <div class="box-num" id="upTop">--</div>
        </div>

    </div>

    <!-- INFO -->
    <div class="mini-info">
        <span>Ping <b id="pingValue">--</b></span>
        <span>Jitter <b id="jitterValue">--</b></span>
    </div>

    <!-- METER -->
    <div class="meter-wrap">

        <div class="meter-status" id="statusText">READY</div>

        <div class="meter">

            <!-- SCALE -->
            <span class="mark m0">0</span>
            <span class="mark m5">5</span>
            <span class="mark m10">10</span>
            <span class="mark m50">50</span>
            <span class="mark m100">100</span>
            <span class="mark m250">250</span>
            <span class="mark m500">500</span>
            <span class="mark m750">750</span>
            <span class="mark m1000">1G</span>

            <!-- NEEDLE -->
            <div class="needle" id="needle"></div>
            <div class="needle-center"></div>

            <!-- VALUE -->
            <div class="meter-value">
                <span id="speedValue">0.00</span>
                <small>Mbps</small>
            </div>

        </div>

    </div>

    <!-- RESULT CARDS -->
    <div class="cards">

        <div class="card">
            <small>PING</small>
            <strong id="pingCard">--</strong>
        </div>

        <div class="card">
            <small>DOWNLOAD</small>
            <strong id="downValue">--</strong>
        </div>

        <div class="card">
            <small>UPLOAD</small>
            <strong id="upValue">--</strong>
        </div>

    </div>

    <!-- BUTTON -->
    <button id="startBtn">START</button>

</div>

<script src="script.js"></script>
</body>
</html>
