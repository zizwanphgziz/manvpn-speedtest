<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="MANVPN Speedtest - Test your internet speed">
<title>MANVPN Speedtest</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo.jpg">
<link rel="apple-touch-icon" href="assets/logo.jpg">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

<!-- INTRO SPLASH -->
<div id="intro" class="intro">
    <video id="introVideo" autoplay playsinline webkit-playsinline muted>
        <source src="assets/intro.mp4" type="video/mp4">
    </video>
    <button id="skipBtn" class="skip-btn">SKIP</button>
</div>

<!-- MAIN APP -->
<div id="app" class="app hidden">

    <!-- BRAND -->
    <div class="brand">
        <img src="assets/logo.png" alt="MANVPN" class="logo">
        <p class="tagline">NO DATA NO PROBLEM</p>
    </div>

    <!-- STATUS -->
    <div class="status-section">
        <div class="status-text" id="statusText">READY</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- GAUGE -->
    <div class="gauge-wrap">
        <svg viewBox="0 0 300 275" class="gauge-svg" id="gaugeSvg">
            <defs>
                <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#6b21a8"/>
                    <stop offset="30%" stop-color="#7c3aed"/>
                    <stop offset="60%" stop-color="#1c73ff"/>
                    <stop offset="100%" stop-color="#00d4ff"/>
                </linearGradient>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="g"/>
                    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <filter id="arcGlow">
                    <feGaussianBlur stdDeviation="6" result="g"/>
                    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <filter id="needleGlow">
                    <feGaussianBlur stdDeviation="4" result="g"/>
                    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
            </defs>

            <!-- Tick track (decorative dots) -->
            <path d="M 96 243.5 A 108 108 0 1 1 204 243.5"
                  fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"
                  stroke-dasharray="1.5 12.6" stroke-linecap="round"/>

            <!-- Background arc -->
            <path d="M 95 245.3 A 110 110 0 1 1 205 245.3"
                  fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="14" stroke-linecap="round"/>

            <!-- Active arc glow (outer bloom) -->
            <path id="gaugeArcGlow" d="M 95 245.3 A 110 110 0 1 1 205 245.3"
                  fill="none" stroke="url(#arcGrad)" stroke-width="24" stroke-linecap="round"
                  stroke-dasharray="576" stroke-dashoffset="576" filter="url(#arcGlow)" opacity="0.4"/>

            <!-- Active arc -->
            <path id="gaugeArc" d="M 95 245.3 A 110 110 0 1 1 205 245.3"
                  fill="none" stroke="url(#arcGrad)" stroke-width="14" stroke-linecap="round"
                  stroke-dasharray="576" stroke-dashoffset="576" filter="url(#glow)"/>

            <!-- Scale labels -->
            <text x="83" y="270" class="scale-text" text-anchor="middle">0</text>
            <text x="25" y="205" class="scale-text" text-anchor="middle">5</text>
            <text x="20" y="118" class="scale-text" text-anchor="middle">10</text>
            <text x="68" y="46" class="scale-text" text-anchor="middle">50</text>
            <text x="150" y="18" class="scale-text" text-anchor="middle">100</text>
            <text x="232" y="46" class="scale-text" text-anchor="middle">250</text>
            <text x="280" y="118" class="scale-text" text-anchor="middle">500</text>
            <text x="275" y="205" class="scale-text" text-anchor="middle">750</text>
            <text x="218" y="270" class="scale-text" text-anchor="middle">1k</text>

            <!-- Needle -->
            <line id="gaugeNeedle" x1="150" y1="150" x2="100" y2="236.6"
                  stroke="white" stroke-width="2.5" stroke-linecap="round" filter="url(#needleGlow)"/>

            <!-- Center dot -->
            <circle cx="150" cy="150" r="6" fill="#00d4ff" filter="url(#glow)"/>
        </svg>

        <!-- Speed display overlaid on gauge -->
        <div class="speed-display">
            <span class="speed-num" id="speedNum">0.00</span>
            <span class="speed-unit">Mbps</span>
        </div>
    </div>

    <!-- RESULT CARDS -->
    <div class="results">
        <div class="result-card">
            <div class="result-icon dl-icon">&#8595;</div>
            <div class="result-label">DOWNLOAD</div>
            <div class="result-value" id="dlResult">--</div>
            <div class="result-unit">Mbps</div>
        </div>
        <div class="result-card">
            <div class="result-icon ul-icon">&#8593;</div>
            <div class="result-label">UPLOAD</div>
            <div class="result-value" id="ulResult">--</div>
            <div class="result-unit">Mbps</div>
        </div>
        <div class="result-card">
            <div class="result-icon ping-icon">&#9679;</div>
            <div class="result-label">PING</div>
            <div class="result-value" id="pingResult">--</div>
            <div class="result-unit">ms</div>
        </div>
        <div class="result-card">
            <div class="result-icon jitter-icon">&#8651;</div>
            <div class="result-label">JITTER</div>
            <div class="result-value" id="jitterResult">--</div>
            <div class="result-unit">ms</div>
        </div>
    </div>

    <!-- CONNECTION INFO -->
    <div class="conn-info">
        <div class="conn-row">
            <span class="conn-label">SERVER</span>
            <span class="conn-value" id="serverInfo">--</span>
        </div>
        <div class="conn-row">
            <span class="conn-label">IP</span>
            <span class="conn-value" id="ipInfo">--</span>
        </div>
    </div>

    <!-- CONTROLS ROW: Mode + Socials -->
    <div class="controls-row">
        <div class="ctrl-group">
            <span class="ctrl-label">Mode :</span>
            <div class="ctrl-btns">
                <button id="dayBtn" class="mode-btn day-btn" aria-label="Day mode">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
                </button>
                <button id="nightBtn" class="mode-btn night-btn active" aria-label="Night mode">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
                </button>
            </div>
        </div>
        <div class="ctrl-group">
            <span class="ctrl-label">Socials :</span>
            <div class="ctrl-btns">
                <a href="https://t.me/manvpnlah" target="_blank" rel="noopener" class="social-btn tg-btn" aria-label="Telegram">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                </a>
                <a href="https://wa.me/601119105034" target="_blank" rel="noopener" class="social-btn wa-btn" aria-label="WhatsApp">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
                </a>
            </div>
        </div>
    </div>

    <!-- START BUTTON -->
    <button id="startBtn" class="start-btn">START</button>

</div>

<script src="script.js"></script>
</body>
</html>
